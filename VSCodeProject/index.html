<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">

  <title>Missionary Random Scripture Project</title>
  

</head>


<body>


<div class="h1">
<h1>Random Scripture!</h1>
</div>



<div class="center-container">

<button id="ranButton" class="random"
  type = button>Random Scripture
</button>


<button id="testing" class="testYourself"
  type = button>Test Yourself
</button>

<button id="mishMode" class="missionaryMode"
  type = button>Missionary Mode
</button>


</div>


<div id="cornerContainerId"class="cornerContainer">

  <button id="ranButtonCor" class="randomSmall"
  type = button>Random Scripture
</button>


<button id="testingCor" class="testYourselfSmall"
  type = button>Test Yourself
</button>

<button id="mishModeCor" class="missionaryModeSmall"
  type = button>Missionary Mode
</button>

<button id="home" class="homeButton"
  type="button">Home
  
</button>

</div>

<div class="likeButtonContainer">

<button id="like" class="likeButton"
  type="button"><likebutton>♡</likebutton>
</button>

</div>
